[project]
name = "sudoku-scanner"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Kristóf Császár", email = "csaszar.kristof.r@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "matplotlib-inline>=0.2.2",
    "numpy>=2.5.4",
    "pillow>=12.3.0",
]

[project.scripts]
sudoku-scanner = "sudoku_scanner:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
